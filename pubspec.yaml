name: fonix_app
description: Offline-first phonics adventures for children on Fire tablets.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/data/curriculum.json
    - assets/audio/
    - assets/licenses/
    - assets/art/
  fonts:
    - family: MPlusRounded
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
          weight: 400
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
